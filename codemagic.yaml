# Codemagic CI — GoRide (iOS -> TestFlight)
#
# This repo holds two Flutter apps in subfolders:
#   - customer_app  (bundle id: com.goride.customer)
#   - driver_app    (bundle id: com.goride.driver)
#
# One-time setup before the first run:
#   1) Enroll in the Apple Developer Program and create two app records in
#      App Store Connect with the bundle ids above.
#   2) Create an App Store Connect API key (Users and Access -> Integrations ->
#      App Store Connect API -> Team Keys) with role "App Manager".
#      Keep the .p8 file and note the Key ID + Issuer ID.
#   3) In Codemagic -> Teams -> Integrations -> Developer Portal, add the API key
#      as an App Store Connect integration named "goride_appstore".
#      (This single integration handles both code signing and TestFlight upload.)
#   4) Push this repo to GitHub. Codemagic will pick up codemagic.yaml automatically.
#
# Run "customer-ios" / "driver-ios" manually from the Codemagic UI, or push a
# tag matching v* to build both automatically.

workflows:
  customer-ios:
    name: GoRide Customer — iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: goride_appstore
    environment:
      flutter: 3.29.3
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.goride.customer
    working_directory: customer_app
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Apply Xcode signing settings
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$(($BUILD_NUMBER))
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Uncomment after creating an external tester group to auto-distribute:
        # beta_groups:
        #   - Public Testers

  driver-ios:
    name: GoRide Driver — iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: goride_appstore
    environment:
      flutter: 3.29.3
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.goride.driver
    working_directory: driver_app
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Apply Xcode signing settings
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$(($BUILD_NUMBER))
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:
        #   - Public Testers
